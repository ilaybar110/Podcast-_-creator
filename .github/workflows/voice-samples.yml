name: Record voice samples

# Pre-records the ▶ voice samples for the web app (docs/previews): the 8 recommended voices in Hebrew and
# English (16 files), using the repository's GEMINI_API_KEY secret. At most 5 new samples per run (one free
# TTS request each), once a day after the free quota resets, until all 16 exist; then it is a no-op.
# Visitors' own keys and quota are never touched. Run it by hand from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"   # shortly after the Gemini free quota resets (midnight Pacific)
  push:
    paths:
      - .github/workflows/voice-samples.yml
      - tools/make_previews.py
      - tools/check_previews.py
      - tools/requirements-previews.txt

# Nothing is granted by default; the job asks only for what it needs.
permissions: {}

concurrency:
  group: voice-samples
  cancel-in-progress: false

jobs:
  record:
    # Forks have neither the secret nor any business pushing here.
    if: github.repository == 'ilaybar110/Podcast-_-creator'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Pinned to full commit SHAs (v4.3.1 / v5.6.0): a moved tag cannot change what runs here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          persist-credentials: false      # the token is not left in .git/config for later steps
      - name: Check for the key
        id: key
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "Add a GEMINI_API_KEY repository secret to record voice samples."
          fi
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null
          # Only what tools/make_previews.py imports, exact versions, checked against hashes.
          pip install -q --require-hashes -r tools/requirements-previews.txt
      - name: Record missing samples
        if: steps.key.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # only this step ever sees the key
        run: python -m tools.make_previews --max 5
      - name: Verify that only voice samples changed
        if: steps.key.outputs.present == 'true'
        run: python -m tools.check_previews
      - name: Commit and push
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}                      # only this step can push
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git add docs/previews
          if git diff --cached --quiet; then echo "No new samples."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record voice samples"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
